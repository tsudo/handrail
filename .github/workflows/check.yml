# Runs the repository checks and the seeded-fault tests on every push and pull request.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml==6.0.2
      - run: python tools/check .
      - run: python tools/test_check.py
