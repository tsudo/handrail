articles:
  '3': Definitions used throughout the Act, including what counts as a substantial modification
  '4': Organizations that provide or deploy AI make sure their staff have enough AI literacy for the systems
    they use
  '5': Lists AI practices that are banned outright
  '6': Sets out when an AI system counts as high-risk
  '9': High-risk providers run a documented risk management process across the system's life
  '10': High-risk providers govern the data used to train, validate and test the system
  '11': High-risk providers keep technical documentation for the system
  '12': High-risk systems log events automatically so their operation can be traced
  '13': High-risk systems come with instructions that let deployers understand and use them properly
  '14': High-risk systems are designed so people can oversee them and stop them
  '15': High-risk systems are accurate, robust and secure for their intended purpose
  '17': High-risk providers run a quality management system
  '19': High-risk providers keep the logs their systems generate automatically
  '20': High-risk providers take corrective action and inform others when a system does not conform
  '22': Providers outside the EU appoint an authorized representative in the EU
  '25': Sets out who carries provider duties along the AI value chain, and the written agreements suppliers
    must give
  '26': Obligations of organizations that deploy high-risk systems, including oversight, monitoring and
    record keeping
  '27': Certain deployers assess the impact on fundamental rights before using a high-risk system
  '43': High-risk systems go through conformity assessment, again after a substantial modification
  '49': High-risk systems are registered in the EU database
  '50': People are told when they interact with AI, and AI-generated content is marked
  '53': Obligations of general-purpose AI model providers
  '55': Extra obligations for general-purpose AI models with systemic risk
  '72': High-risk providers monitor their systems after they are placed on the market
  '73': Serious incidents involving high-risk systems are reported
